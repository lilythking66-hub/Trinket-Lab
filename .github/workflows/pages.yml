name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/components _site/demos _site/triggers _site/skins
          cp index.html _site/
          cp -R components/camera-kit components/instant-camera components/instant-photo components/photo-engine components/printer _site/components/
          cp -R demos/instant-photo-family demos/printer _site/demos/
          cp -R triggers/qr _site/triggers/
          for skin in skins/*; do
            if [ -d "$skin/web" ]; then
              name=$(basename "$skin")
              mkdir -p "_site/skins/$name"
              cp -R "$skin/web" "_site/skins/$name/"
            fi
          done

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
